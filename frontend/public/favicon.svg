<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="col1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="col2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="col3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="col4Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="sparkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Navy Squircle with Glowing Border -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="10"/>

  <!-- Ascending Bar Chart Columns -->
  <rect x="105" y="295" width="55" height="110" rx="16" fill="url(#col1Grad)"/>
  <rect x="185" y="235" width="55" height="170" rx="16" fill="url(#col2Grad)"/>
  <rect x="265" y="165" width="55" height="240" rx="16" fill="url(#col3Grad)"/>
  <rect x="345" y="195" width="55" height="210" rx="16" fill="url(#col4Grad)"/>

  <!-- AI Spark Star at the Apex -->
  <g filter="url(#sparkGlow)">
    <path d="M 372.5 70 Q 372.5 120 422.5 120 Q 372.5 120 372.5 170 Q 372.5 120 322.5 120 Q 372.5 120 372.5 70 Z" fill="#ffffff"/>
    <circle cx="372.5" cy="120" r="10" fill="#38bdf8"/>
  </g>
</svg>