<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182642"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Dark Blue Background Container with Blue Border -->
  <rect x="24" y="24" width="464" height="464" rx="110" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12"/>

  <!-- Robot Icon -->
  <g stroke="#38bdf8" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Antenna -->
    <path d="M 256 130 V 195" />

    <!-- Head Frame -->
    <rect x="140" y="195" width="232" height="175" rx="40" />

    <!-- Eyes (Vertical Slits) -->
    <line x1="210" y1="255" x2="210" y2="310" />
    <line x1="302" y1="255" x2="302" y2="310" />

    <!-- Ear Mounts -->
    <line x1="96" y1="282.5" x2="140" y2="282.5" />
    <line x1="372" y1="282.5" x2="416" y2="282.5" />
  </g>
</svg>